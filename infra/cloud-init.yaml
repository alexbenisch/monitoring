#cloud-config
# Runs once, on first boot only. Changing this file will NOT reconfigure a
# running server (see the ignore_changes in main.tf) - rebuild or run the steps
# by hand.

users:
  - name: lab
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - conntrack
  - apt-transport-https

write_files:
  - path: /etc/systemd/system/minikube.service
    owner: root:root
    permissions: '0644'
    content: |
      ${minikube_unit}

  - path: /etc/sysctl.d/99-obs-lab.conf
    content: |
      # Prometheus' TSDB and minikube both open a lot of files.
      fs.inotify.max_user_instances = 512
      fs.inotify.max_user_watches   = 524288
      vm.max_map_count              = 262144

runcmd:
  # --- docker ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker lab
  - systemctl enable --now docker

  # --- kubectl ---
  - curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  - chmod +x /usr/local/bin/kubectl

  # --- helm ---
  - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 -o /tmp/get-helm-3
  - chmod +x /tmp/get-helm-3
  - /tmp/get-helm-3

  # --- minikube ---
  - curl -fsSL -o /usr/local/bin/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
  - chmod +x /usr/local/bin/minikube

  # Enabled, deliberately not started: there is no cluster yet on first boot.
  # ConditionPathExists in the unit keeps it inert until 00-bootstrap.sh has
  # created the profile, after which every reboot brings the cluster back.
  - systemctl daemon-reload
  - systemctl enable minikube.service

  - sysctl --system
  - touch /var/lib/cloud/obs-lab-ready

final_message: "obs-lab ready after $UPTIME seconds. ssh lab@<ip>, then ./scripts/00-bootstrap.sh"
