# Jenkins controller for scenario 05, chart jenkins/jenkins 5.9.63.
#
# Everything the controller is configured with lives here or in JCasC below:
# a Jenkins you cannot rebuild from this file is a pet.

controller:
  # The chart default limit is 4 GiB, enough for one Jenkins to eat most of
  # the headroom the cpx42 resize bought. Builds do not run here -
  # numExecutors is 0 and every build gets its own agent pod - so the
  # controller only needs room for the UI, the queue and the plugins.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi
  # Size the heap from the limit, leaving room for metaspace and threads.
  javaOpts: "-XX:MaxRAMPercentage=65"

  # On the tailnet as http://jenkins:8080, like every other service in the
  # lab. Only the controller Service gets this; the agent listener Service
  # stays cluster-internal.
  serviceAnnotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jenkins"
  jenkinsUrl: "http://jenkins:8080/"

  # Every plugin pinned, dependencies included: the full set exported from
  # a Jenkins that worked (2026-09-29, 78 plugins, none inactive), so a
  # reinstall months from now gets exactly this Jenkins.
  #
  # installLatestPlugins: false only works with the WHOLE set listed. With
  # just the top-level plugins listed, the resolver picks each dependency's
  # minimum version on its own, and once mixed two Declarative Pipeline
  # releases that could not load together (c80a586). With every version
  # given, it has nothing left to choose.
  #
  # To upgrade: set installLatestPlugins back to true, apply, check that
  # nothing is inactive, then export the new set and paste it here:
  #   curl -su admin:$PW 'http://jenkins:8080/pluginManager/api/json?depth=1&tree=plugins%5BshortName,version%5D' \
  #     | jq -r '.plugins[] | "    - \(.shortName):\(.version)"' | sort
  #
  # This replaces the chart's own list, which is why junit (test results),
  # job-dsl (the JCasC jobs below) and prometheus (/prometheus, scraped
  # below) are in here rather than in additionalPlugins.
  installLatestPlugins: false
  installPlugins:
