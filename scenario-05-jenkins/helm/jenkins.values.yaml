  # Scraped by scenario 01's Prometheus. It only picks up ServiceMonitors
  # carrying its Helm release label - without it this one is silently
  # ignored, which is the classic "target never shows up" failure.
  prometheus:
    enabled: true
    serviceMonitorAdditionalLabels:
      release: kube-prom-stack
    scrapeInterval: 30s

  # Works around the chart's plugin copy failing after a reboot of the lab
  # host. The chart's init container copies plugins into an emptyDir with
  # `yes n | cp -i ...` under `set -e`. When the pod's containers restart in
  # place, as they do after a reboot, the emptyDir still holds last boot's
  # plugins; declining each overwrite makes cp exit 1, and Jenkins never
  # starts. Custom init containers run first, so emptying the directory here
  # means the chart's copy always starts clean.
  customInitContainers:
    - name: clear-plugins
      image: busybox:1.37
      command: ["sh", "-c", "rm -rf /var/jenkins_plugins/*"]
      volumeMounts:
        - name: plugin-dir
          mountPath: /var/jenkins_plugins

  # The admin password is generated by the chart into the `jenkins` Secret;
  # 10-jenkins.sh prints the command that reads it.

  JCasC:
    configScripts:
      welcome: |
        jenkins:
          systemMessage: >-
            obs-lab scenario 05. Configured from
            scenario-05-jenkins/helm/jenkins.values.yaml - changes made in
            this UI are lost on the next restart.
      # hello-java lives in this repo (obs-m23), so the job polls monitoring
      # and the Jenkinsfile skips builds that did not touch the app.
      jobs: |
        jobs:
          - script: >
              pipelineJob('hello-java') {
                description('Builds scenario-05-jenkins/hello-java from the monitoring repo.')
                // Same schedule as the Jenkinsfile's triggers block. It has to
                // be here too: every JCasC reload rewrites the job from this
                // definition, and a trigger only the Jenkinsfile declared is
                // silently dropped until the next build runs - which, with
                // polling gone, is never.
                properties {
                  pipelineTriggers {
                    triggers {
                      pollSCM { scmpoll_spec('H/2 * * * *') }
                    }
                  }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/alexbenisch/monitoring.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('scenario-05-jenkins/hello-java/Jenkinsfile')
                    // A full checkout, not a lightweight one: only a full
                    // checkout records the changelog before the pipeline
                    // starts, and the Jenkinsfile's changeset filter
                    // decides from that changelog, before any agent pod.
                    lightweight(false)
                  }
                }
              }
