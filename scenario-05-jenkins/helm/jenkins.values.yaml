# Jenkins controller for scenario 05, chart jenkins/jenkins 5.9.63.
#
# Everything the controller is configured with lives here or in JCasC below:
# a Jenkins you cannot rebuild from this file is a pet.

controller:
  # The chart default limit is 4 GiB, enough for one Jenkins to eat most of
  # the headroom the cpx42 resize bought. Builds do not run here -
  # numExecutors is 0 and every build gets its own agent pod - so the
  # controller only needs room for the UI, the queue and the plugins.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1536Mi
  # Size the heap from the limit, leaving room for metaspace and threads.
  javaOpts: "-XX:MaxRAMPercentage=65"

  # On the tailnet as http://jenkins:8080, like every other service in the
  # lab. Only the controller Service gets this; the agent listener Service
  # stays cluster-internal.
  serviceAnnotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jenkins"
  jenkinsUrl: "http://jenkins:8080/"

  # The chart default is to resolve every plugin dependency to its latest
  # version, so a reinstall months from now gets a different Jenkins than
  # today. Keep the chart's pinned list and resolve dependencies to the
  # minimum those pins need.
  installLatestPlugins: false

  # The admin password is generated by the chart into the `jenkins` Secret;
  # 10-jenkins.sh prints the command that reads it.

  JCasC:
    configScripts:
      welcome: |
        jenkins:
          systemMessage: >-
            obs-lab scenario 05. Configured from
            scenario-05-jenkins/helm/jenkins.values.yaml - changes made in
            this UI are lost on the next restart.
