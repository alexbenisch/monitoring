apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# Jenkins sets the image per build with:
#   kustomize edit set image obs-lab/hello-java=<registry>/hello-java:<tag>
# which rewrites both the name and the tag, so the same manifests serve the
# by-hand path and the pipeline.
images:
  - name: obs-lab/hello-java
    newTag: dev
